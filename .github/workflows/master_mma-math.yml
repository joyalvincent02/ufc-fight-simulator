name: Build and deploy Python app to Azure Web App - mma-math

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_646F81D9BE6348D78F7F5A07FB9AD407 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2F8A1310B367419385F24588B9057006 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F413CA3A69F448D39E96A4F5899CBC3F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mma-math'
          slot-name: 'Production'
          package: ./backend
          startup-command: 'gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app'

      - name: Wait for app to start
        run: |
          echo "Waiting for app to become healthy (up to 5 minutes)..."
          for i in {1..30}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.AZURE_APP_URL }}/health" || echo "000")
            echo "Attempt $i/30: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "App is healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Warning: app did not become healthy in time, proceeding anyway"
            fi
            sleep 10
          done

      - name: Retrain ML model with current package versions
        run: |
          echo "Triggering post-deploy model retrain (runs async on Azure, may take 5-10 min)..."
          response=$(curl -s -w "\n%{http_code}" --max-time 600 -X POST "${{ secrets.AZURE_APP_URL }}/retrain-ml-model?min_new_results=0")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          echo "Response ($http_code): $body"
          if [ "$http_code" -ne 200 ]; then
            echo "Warning: retrain request failed (HTTP $http_code) - the NaN guard will keep the app running until Monday's scheduled retrain"
          else
            echo "Model successfully retrained with current package versions"
          fi
