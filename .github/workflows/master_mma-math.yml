name: Build and deploy Python app to Azure Web App - mma-math

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Validate requirements install cleanly in CI before pushing to Azure.
      # Key change: xgboost-cpu removes the nvidia-nccl-cu12 transitive
      # dependency (~190 MB), which was the primary cause of Oryx hanging
      # at the "Using zstd for compression" step.
      - name: Validate Python dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "Installed packages:"
          pip list --format=columns | grep -E "xgboost|nvidia|scikit|playwright|fastapi"

      # Verify no nvidia GPU packages snuck back in via transitive deps
      - name: Check for unexpected GPU packages
        run: |
          if pip list | grep -i "nvidia-nccl"; then
            echo "ERROR: nvidia-nccl found in dependencies. Check requirements.txt."
            exit 1
          fi
          echo "OK: no nvidia-nccl dependency detected"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_646F81D9BE6348D78F7F5A07FB9AD407 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2F8A1310B367419385F24588B9057006 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F413CA3A69F448D39E96A4F5899CBC3F }}

      # Deploy source code.  Azure Oryx will install requirements.txt.
      # With xgboost-cpu (~5 MB vs xgboost + nvidia-nccl-cu12 ~200 MB),
      # the Oryx build phase is dramatically shorter.
      # IMPORTANT: ensure SCM_DO_BUILD_DURING_DEPLOYMENT=true in App Settings
      # (Azure default) so Oryx runs pip install from requirements.txt.
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mma-math'
          slot-name: 'Production'
          package: ./backend
          startup-command: 'bash startup.sh'

      - name: Wait for app to start
        run: |
          echo "Waiting for app to become healthy (up to 5 minutes)..."
          echo "Note: first cold start installs Playwright Chromium (~60 s extra)"
          for i in {1..36}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.AZURE_APP_URL }}/health" || echo "000")
            echo "Attempt $i/36: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "App is healthy"
              break
            fi
            if [ "$i" = "36" ]; then
              echo "Warning: app did not become healthy in time, proceeding anyway"
            fi
            sleep 10
          done

      - name: Retrain ML model with current package versions
        run: |
          echo "Triggering post-deploy model retrain (runs async on Azure, may take 5-10 min)..."
          response=$(curl -s -w "\n%{http_code}" --max-time 600 -X POST -H "X-Admin-Key: ${{ secrets.ADMIN_SECRET }}" "${{ secrets.AZURE_APP_URL }}/retrain-ml-model?min_new_results=0")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          echo "Response ($http_code): $body"
          if [ "$http_code" -ne 200 ]; then
            echo "Warning: retrain request failed (HTTP $http_code) - the NaN guard will keep the app running until Monday's scheduled retrain"
          else
            echo "Model successfully retrained with current package versions"
          fi
