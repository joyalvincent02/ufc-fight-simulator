name: Keep Apps Warm

on:
  schedule:
    # Every 15 minutes during peak hours (6 AM - 10 PM UTC)
    - cron: '*/15 6-22 * * *'
    # Every 30 minutes during off-peak hours (10 PM - 6 AM UTC)
    - cron: '*/30 22-23,0-5 * * *'
  
  # Manual trigger
  workflow_dispatch:

jobs:
  keep-warm:
    runs-on: ubuntu-latest
    
    steps:
    - name: Ping Render Backend
      run: |
        echo "Keeping Render app warm..."
        echo "Current time: $(date -u)"
        
        response=$(curl -s -w "%{http_code}" -m 30 "${{ secrets.RENDER_APP_URL }}/health")
        
        if [ "$response" = "200" ]; then
          echo "Render: healthy and warm"
        elif [[ "$response" =~ ^[0-9]{3}$ ]]; then
          echo "Render: responded with HTTP $response"
        else
          echo "Render: may be sleeping or unreachable"
        fi
        
        status_response=$(curl -s -w "%{http_code}" -m 15 "${{ secrets.RENDER_APP_URL }}/scheduler/status" | tail -c 3)
        
        if [ "$status_response" = "200" ]; then
          echo "Render scheduler status: OK"
        else
          echo "Render scheduler status: HTTP $status_response"
        fi

    - name: Ping Azure Backend
      run: |
        echo "Keeping Azure app warm..."
        
        response=$(curl -s -w "%{http_code}" -m 30 "${{ secrets.AZURE_APP_URL }}/health")
        
        if [ "$response" = "200" ]; then
          echo "Azure: healthy and warm"
        elif [[ "$response" =~ ^[0-9]{3}$ ]]; then
          echo "Azure: responded with HTTP $response"
        else
          echo "Azure: may be sleeping or unreachable"
        fi
        
        status_response=$(curl -s -w "%{http_code}" -m 15 "${{ secrets.AZURE_APP_URL }}/scheduler/status" | tail -c 3)
        
        if [ "$status_response" = "200" ]; then
          echo "Azure scheduler status: OK"
        else
          echo "Azure scheduler status: HTTP $status_response"
        fi

    - name: Log Activity
      run: |
        echo "Keep-warm activity logged at $(date -u)" >> $GITHUB_STEP_SUMMARY
